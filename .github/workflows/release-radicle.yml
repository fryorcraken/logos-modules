name: Release radicle (core)

# Manually-triggered release for the "radicle" core module. Delegates the
# build / verify / sign / publish pipeline to the local
# _release-module.yml reusable workflow so signing config lives in
# exactly one place.
#
# logos-radicle-module is a monorepo holding two modules (core "radicle"
# and UI "radicle_ui") in one git repo, so it's registered as a single
# submodule at submodules/radicle-module with two hand-maintained release
# workflows pointing at each module's subdirectory — see also
# release-radicle_ui-module.yml. NOT auto-discoverable by release-all.yml,
# which assumes one module per submodule path; run both per-module
# workflows individually instead.
#
# Source of truth for module name + version is
# submodules/radicle-module/radicle/metadata.json — read by the upstream
# logos-modules-release-action.
#
# This file started from scripts/add-module.sh's template, then was
# hand-edited for the monorepo subpath — don't regenerate it from the
# template without preserving module_path.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/radicle-module/radicle
      force_build: ${{ inputs.force_build }}
    secrets: inherit
